apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task will clean up the workspace by deleting any existing files
  workspaces:
    - name: source
  steps:
    - name: clean
      image: alpine:latest
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env sh
        set -e
        rm -rf ./* ./.??*
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task will run unit tests using nose
  workspaces:
    - name: source
  params:
    - name: args
      type: string
      default: "-v"
    steps:
      - name: nosetests
        image: python:3.9-slim
        workingDir: $(workspaces.source.path)
        script: |
          #!/bin/bash
          set -e
          python -m pip install --upgrade pip
          if [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          fi
          nosetests $(params.args)
