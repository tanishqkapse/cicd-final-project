apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup
spec:
  description: This task removes all files from the workspace directory
  workspaces:
    - name: source
  steps:
    - name: clean
      image: alpine:latest
      env:
        - name: WORKSPACE_SOURCE_PATH
          value: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        echo "Cleaning workspace directory..."
        if [ -d "$WORKSPACE_SOURCE_PATH" ]; then
          rm -rf "$WORKSPACE_SOURCE_PATH"/*
          rm -rf "$WORKSPACE_SOURCE_PATH"/.[!.]*
        fi
        echo "Workspace cleaned successfully"
---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: nose
spec:
  description: This task runs nose unit tests on the Python application
  workspaces:
    - name: source
  params:
    - name: image
      type: string
      default: "python:3.9-slim"
      description: The Python image to use
    - name: args
      type: string
      default: "-v --with-spec --spec-color --with-coverage --cover-package=service"
      description: Arguments for nosetests
  steps:
    - name: Run unit tests with nose
      image: $(params.image)
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -e
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        nosetests $(params.args)
